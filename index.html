function makeRow(product,index){
  var row=document.createElement("div"); row.className="product";
  var name=document.createElement("div"); name.className="product-name"; name.textContent=product[0];
  var input=document.createElement("input"); input.className="qty"; input.type="number"; input.inputMode="numeric"; input.pattern="[0-9]*"; input.min="0"; input.step="1"; input.value="0"; input.setAttribute("data-index",String(index));

function calculate(){
  var totals={}; for(var i=0;i<DATA.factoryProducts.length;i++) totals[DATA.factoryProducts[i]]=0;

  return totals;
}
