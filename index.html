html,body{margin:0;padding:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
.header h1{margin:0;font-size:20px} .header p{margin:4px 0 8px;color:#777;font-size:12px}
.search{width:100%;height:42px;border:1px solid #bbb;border-radius:9px;padding:0 12px;font-size:16px;background:#fafafa}
main{max-width:760px;margin:0 auto;padding:12px 12px calc(88px + env(safe-area-inset-bottom))}
.product{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e1e1e1;border-radius:11px;padding:9px 10px;margin-bottom:7px;min-height:62px}
.product.active{border-color:#78a878;background:#f0faf0}
.name{flex:1;min-width:0;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.controls{display:flex;align-items:center;gap:4px}
.step{width:38px;height:40px;border:1px solid #bbb;border-radius:8px;background:#eee;font-size:21px;line-height:1}
.qty{width:58px;height:40px;border:1px solid #aaa;border-radius:8px;background:#fafafa;text-align:center;font-size:17px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid #ddd;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
.summaryBtn{flex:1;height:48px;border:0;border-radius:10px;background:#222;color:#fff;font-size:15px;font-weight:700}
.count{min-width:100px;height:48px;border:1px solid #ccc;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#777}
.count strong{font-size:16px;color:#222}
.panel{display:none;position:fixed;inset:0;z-index:30;background:#f5f5f7;overflow:auto;-webkit-overflow-scrolling:touch}
.panelHead{position:sticky;top:0;z-index:31;background:#fff;border-bottom:1px solid #ddd;padding:calc(12px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px}
.panelHead h2{font-size:19px;margin:0;flex:1} .close{height:40px;padding:0 14px;border:0;border-radius:8px;background:#e6e6e8;font-weight:600}
.card{background:#fff;margin:12px;border:1px solid #ddd;border-radius:12px;overflow:hidden}
.result{display:flex;justify-content:space-between;gap:12px;padding:13px;border-bottom:1px solid #eee;font-size:14px}
.result:last-child{border-bottom:0} .total{font-size:17px;font-weight:800}
.empty{text-align:center;color:#777;padding:25px}
</style>

<body>

var productsEl=document.getElementById("products");
var search=document.getElementById("search");
var countEl=document.getElementById("count");
var panel=document.getElementById("panel");
var results=document.getElementById("results");
var totalEl=document.getElementById("total");

var values=[];
for(var i=0;i<DATA.products.length;i++) values.push(0);

function fmt(n){return Math.abs(n-Math.round(n))<1e-10?String(Math.round(n)):n.toFixed(2).replace(".",",");}

function updateCount(){
  var c=0;
  for(var i=0;i<values.length;i++) if(Number(values[i])>0)c++;
  countEl.textContent=c+" / "+values.length;
}

function makeProduct(i){
  var p=DATA.products[i];
  var row=document.createElement("div"); row.className="product"; row.setAttribute("data-index",String(i));
  var name=document.createElement("div"); name.className="name"; name.textContent=p.name;
  var controls=document.createElement("div"); controls.className="controls";
  var minus=document.createElement("button"); minus.className="step"; minus.type="button"; minus.textContent="−";
  var input=document.createElement("input"); input.className="qty"; input.type="number"; input.inputMode="numeric"; input.min="0"; input.step="1"; input.value="0";
  var plus=document.createElement("button"); plus.className="step"; plus.type="button"; plus.textContent="+";
  function set(v){
    v=Math.max(0,Math.floor(Number(v)||0)); values[i]=v; input.value=String(v);
    row.className=v>0?"product active":"product"; updateCount();
  }
  minus.addEventListener("click",function(){set(values[i]-1);});
  plus.addEventListener("click",function(){set(values[i]+1);});
  input.addEventListener("input",function(){set(input.value);});
  controls.appendChild(minus); controls.appendChild(input); controls.appendChild(plus);
  row.appendChild(name); row.appendChild(controls);
  return row;
}

function render(){
  productsEl.innerHTML="";
  var q=search.value.toLocaleLowerCase("tr-TR").trim(), shown=0;
  for(var i=0;i<DATA.products.length;i++){
    var name=DATA.products[i].name.toLocaleLowerCase("tr-TR");
    if(!q || name.indexOf(q)>=0){productsEl.appendChild(makeProduct(i));shown++;}
  }
  if(!shown){var e=document.createElement("div");e.className="empty";e.textContent="Ürün bulunamadı.";productsEl.appendChild(e);}
}
function calculate(){
  var totals={}; for(var i=0;i<DATA.factoryProducts.length;i++) totals[DATA.factoryProducts[i]]=0;
  for(var i=0;i<DATA.products.length;i++){
    var q=Number(values[i])||0, a=DATA.products[i].allocations;
    for(var j=0;j<a.length;j++) totals[a[j][0]]=(totals[a[j][0]]||0)+q*a[j][1]/a[j][2];
  }
  return totals;
}
function showSummary(){
  var totals=calculate(), total=0; results.innerHTML="";
  for(var i=0;i<DATA.factoryProducts.length;i++){
    var n=DATA.factoryProducts[i], v=totals[n]||0; total+=v;
    var row=document.createElement("div"); row.className="result";
    var a=document.createElement("span"); a.textContent=n;
    var b=document.createElement("strong"); b.textContent=fmt(v);
    row.appendChild(a);row.appendChild(b);results.appendChild(row);
  }
  totalEl.textContent=fmt(total); panel.style.display="block"; window.scrollTo(0,0);
}
search.addEventListener("input",render);
document.getElementById("summaryButton").addEventListener("click",showSummary);
document.getElementById("closeButton").addEventListener("click",function(){panel.style.display="none";});
render(); updateCount();
